server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_origin lxcup-server:8080;

    location = /api {
        proxy_pass http://$api_origin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_intercept_errors off;
    }

    location = /api/v1/events {
        proxy_pass http://$api_origin;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_intercept_errors off;
    }

    location ^~ /api/ {
        proxy_pass http://$api_origin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_intercept_errors off;
    }

    location = / {
        try_files /index.html =404;
    }

    location ~ ^/(servers|windows|containers|targets|docker|enrollments/new|workflows|schedules|update-policies|secrets|account/password|admin/users|admin/audit|wiki)/?$ {
        try_files /index.html =404;
    }

    location ~ ^/targets/[^/]+(/packages)?/?$ {
        try_files /index.html =404;
    }

    location ~ ^/containers/[^/]+/?$ {
        try_files /index.html =404;
    }

    location ~ ^/workflows/[^/]+/?$ {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }

    error_page 404 /index.html;

    location = /index.html {
        internal;
    }

    location = /health/frontend {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
