---
- name: Collect a complete Windows package inventory
  hosts: lxcup_windows_targets
  gather_facts: false
  tasks:
    - name: Collect a bounded and normalized package inventory
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $inventory = @{}
        $items = @(Get-Package)
        if ($items.Count -gt 50000) { throw 'package inventory limit exceeded' }
        foreach ($item in $items) {
          $name = [string]$item.Name
          $version = [string]$item.Version
          if ([string]::IsNullOrWhiteSpace($name) -or [string]::IsNullOrWhiteSpace($version)) {
            throw 'package provider returned an invalid entry'
          }
          if (-not $inventory.ContainsKey($name)) { $inventory[$name] = @() }
          $inventory[$name] += @{ version = $version; provider = [string]$item.ProviderName }
        }
        @{ packages = $inventory } | ConvertTo-Json -Depth 8 -Compress
      register: lxcup_windows_packages
      changed_when: false

    - name: Stage normalized Windows package inventory for the worker
      ansible.windows.win_copy:
        content: "{{ lxcup_windows_packages.stdout }}"
        dest: "{{ lxcup_package_inventory_remote_file }}"

    - name: Fetch package inventory into the worker's temporary directory
      ansible.builtin.fetch:
        src: "{{ lxcup_package_inventory_remote_file }}"
        dest: "{{ lxcup_package_inventory_output }}"
        flat: true
