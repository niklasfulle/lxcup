---
- name: Collect a complete Linux package inventory
  hosts: lxcup_targets
  become: true
  gather_facts: false
  tasks:
    - name: Refresh APT metadata when older than one hour
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Gather installed packages from the registered package manager
      ansible.builtin.package_facts:
        manager: auto

    - name: Find newer package versions available from configured repositories
      ansible.builtin.command: apt list --upgradable
      register: lxcup_upgradable_packages
      changed_when: false

    - name: Stage normalized package inventory for the worker
      ansible.builtin.copy:
        content: "{{ {'packages': ansible_facts.packages, 'upgradable': lxcup_upgradable_packages.stdout_lines} | to_json }}"
        dest: "{{ lxcup_package_inventory_remote_file }}"
        mode: '0600'

    - name: Fetch package inventory into the worker's temporary directory
      ansible.builtin.fetch:
        src: "{{ lxcup_package_inventory_remote_file }}"
        dest: "{{ lxcup_package_inventory_output }}"
        flat: true

    - name: Remove the temporary package inventory from the target
      ansible.builtin.file:
        path: "{{ lxcup_package_inventory_remote_file }}"
        state: absent
