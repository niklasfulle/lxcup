[workspace]
members = [
    "crates/lxcup-core",
    "crates/lxcup-apt",
    "crates/lxcup-agent",
    "crates/lxcup-ansible",
    "crates/lxcup-ansible-worker",
    "crates/lxcup-execution",
    "crates/lxcup-cli",
    "crates/lxcup-observability",
    "crates/lxcup-persistence",
    "crates/lxcup-planner",
    "crates/lxcup-safety",
    "crates/lxcup-secrets",
    "crates/lxcup-server",
    "crates/lxcup-test-support",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/niklasfulle/lxcup"

[workspace.dependencies]
axum = { version = "0.8", features = ["json", "macros"] }
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5.7"
uuid = { version = "1.18", features = ["serde", "v4"] }
