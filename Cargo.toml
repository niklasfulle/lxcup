[workspace]
members = [
    "crates/lxcup-core",
    "crates/lxcup-cli",
    "crates/lxcup-server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/niklasfulle/lxcup"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
