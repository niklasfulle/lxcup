services:
  lxcup-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      LXCUP_ENV: production
      LXCUP_BACKUP_DIR: /var/lib/lxcup/backups
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    volumes:
      - lxcup-backups:/var/lib/lxcup/backups
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  lxcup-frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile.prod
    restart: unless-stopped
    depends_on:
      lxcup-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1/health/frontend"]
      interval: 15s
      timeout: 5s
      retries: 5

  lxcup-artifacts:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ../artifacts:/usr/share/nginx/html/agent:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      lxcup-frontend:
        condition: service_healthy
      lxcup-artifacts:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "caddy validate --config /etc/caddy/Caddyfile >/dev/null 2>&1 && kill -0 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  lxcup-backups:
  caddy-data:
  caddy-config:
