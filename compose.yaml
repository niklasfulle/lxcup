services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${LXCUP_POSTGRES_DB:?LXCUP_POSTGRES_DB is required}
      POSTGRES_USER: ${LXCUP_POSTGRES_USER:?LXCUP_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${LXCUP_POSTGRES_PASSWORD:?LXCUP_POSTGRES_PASSWORD is required}
    ports:
      - target: 5432
        published: "${LXCUP_POSTGRES_PORT:-5433}"
        host_ip: "${LXCUP_POSTGRES_HOST_IP:-0.0.0.0}"
    volumes:
      - lxcup-postgres-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 1g

  lxcup-server:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    env_file:
      - ${LXCUP_SERVICE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgres://${LXCUP_POSTGRES_USER}:${LXCUP_POSTGRES_PASSWORD}@postgres:5432/${LXCUP_POSTGRES_DB}
      LXCUP_BIND_ADDRESS: 0.0.0.0:8080
      LXCUP_DEV_SEED: ${LXCUP_DEV_SEED:-true}
      LXCUP_SECRET_STORE_DIR: /var/lib/lxcup/secrets
      LXCUP_SECRET_MASTER_KEY: ${LXCUP_SECRET_MASTER_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - target: 8080
        published: "${LXCUP_SERVER_PORT:-8080}"
        host_ip: "${LXCUP_SERVER_HOST_IP:-0.0.0.0}"
    volumes:
      - lxcup-secrets:/var/lib/lxcup/secrets
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://lxcup-server:8080
      # Öffentliche URL, unter der ein Zielhost das Bootstrap-Skript laden kann.
      # Fällt ohne Konfiguration auf die Browser-Origin zurück.
      VITE_BOOTSTRAP_BASE_URL: ${LXCUP_PUBLIC_URL:-}
    depends_on:
      lxcup-server:
        condition: service_started
    ports:
      - target: 5173
        published: "${LXCUP_FRONTEND_PORT:-5173}"
        host_ip: "${LXCUP_FRONTEND_HOST_IP:-0.0.0.0}"
    volumes:
      - ./frontend:/app
      - lxcup-frontend-node-modules:/app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  artifacts:
    image: nginx:1.27-alpine
    volumes:
      - ./artifacts:/usr/share/nginx/html:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1/agent/0.2.0/manifest.json"]
      interval: 10s
      timeout: 5s
      retries: 5

  lxcup-worker:
    build:
      context: .
      dockerfile: deploy/worker.Dockerfile
    env_file:
      - ${LXCUP_SERVICE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgres://${LXCUP_POSTGRES_USER}:${LXCUP_POSTGRES_PASSWORD}@postgres:5432/${LXCUP_POSTGRES_DB}
      LXCUP_SECRET_STORE_DIR: /var/lib/lxcup/secrets
      LXCUP_SECRET_MASTER_KEY: ${LXCUP_SECRET_MASTER_KEY:-}
      LXCUP_ARTIFACT_BASE_URL: ${LXCUP_ARTIFACT_BASE_URL:-http://artifacts}
      LXCUP_WORKER_SSH_USER: ${LXCUP_WORKER_SSH_USER:-lxcup}
      # Vom Zielsystem erreichbare Controller-URL für Agent-Heartbeats.
      LXCUP_CONTROLLER_URL: ${LXCUP_CONTROLLER_URL:-http://lxcup-server:8080}
    volumes:
      - lxcup-secrets:/var/lib/lxcup/secrets:ro
      - ./ansible:/opt/lxcup/ansible:ro
    depends_on:
      postgres:
        condition: service_healthy
      lxcup-server:
        condition: service_healthy
      artifacts:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${LXCUP_TEST_POSTGRES_DB:?LXCUP_TEST_POSTGRES_DB is required}
      POSTGRES_USER: ${LXCUP_TEST_POSTGRES_USER:?LXCUP_TEST_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${LXCUP_TEST_POSTGRES_PASSWORD:?LXCUP_TEST_POSTGRES_PASSWORD is required}
    ports:
      - target: 5432
        published: "${LXCUP_TEST_POSTGRES_PORT:-5434}"
        host_ip: "${LXCUP_TEST_POSTGRES_HOST_IP:-0.0.0.0}"
    volumes:
      - lxcup-postgres-test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 1g

  onboarding-ssh-test:
    profiles: [onboarding-e2e]
    build:
      context: .
      dockerfile: tests/onboarding-ssh/Dockerfile
    environment:
      LXCUP_E2E_SSH_PASSWORD: ${LXCUP_E2E_SSH_PASSWORD:-}
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
    stop_signal: SIGRTMIN+3
    healthcheck:
      test: ["CMD-SHELL", "systemctl is-active --quiet ssh.service"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  lxcup-postgres-dev:
    name: ${LXCUP_POSTGRES_VOLUME_NAME:-lxcup-postgres-dev-v2}
  lxcup-postgres-test:
  lxcup-frontend-node-modules:
  lxcup-secrets:
